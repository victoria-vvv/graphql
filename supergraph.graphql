  @join__type(graph: USER)
{
  getHistoricalExchangeRates(baseCurrency: String!, targetCurrency: String!, startDate: Date!, endDate: Date!): [ExchangeRate] @join__field(graph: FINANCE)
  getTransactionsInPeriodByCategories(startDate: Date!, endDate: Date!, category: String!): [Transaction] @join__field(graph: FINANCE)
  getAverageSpendingByPeriod(period: String!, transactionType: String): BigDecimal @join__field(graph: FINANCE)
  getActiveInvestments: [Investment] @join__field(graph: FINANCE)
