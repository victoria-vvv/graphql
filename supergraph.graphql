  passwordHash: String @join__field(graph: USER)
  language: String @join__field(graph: USER)
  notification: Boolean @join__field(graph: USER)
  createdAt: DateTime @join__field(graph: USER)
  updatedAt: DateTime @join__field(graph: USER)
}

