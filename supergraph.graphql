{
  makeLoanPayment(loanId: ID!, amount: BigDecimal!): LoanPayment @join__field(graph: FINANCE)
  createExchangeRate(input: ExchangeRateInput!): ExchangeRate @join__field(graph: FINANCE)
  createAccount(input: AccountInput!): Account @join__field(graph: FINANCE)
  createTransaction(input: TransactionInput): Transaction @join__field(graph: FINANCE)
  updateUserProfile(input: UserProfileInput!): UserProfile @join__field(graph: USER)
}

